name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html exists and is non-empty
        run: |
          test -f index.html && test -s index.html
          echo "index.html OK ($(wc -c < index.html) bytes)"
      - name: Verify an auth gate is present
        run: |
          # Never assert against a plaintext credential here: this repo is public
          # and CI logs are world-readable. Only check the gate wiring exists.
          grep -q "crypto.subtle.digest" index.html
          grep -q 'id="pw"' index.html
          echo "Auth gate present ✓"
      - name: Fail if the access code is committed in plaintext
        run: |
          # This repo is public, so the check must not restate the credential or
          # its shape. Instead, hash every short word in tracked text files and
          # compare against the gate's own stored digest read from index.html.
          PH=$(grep -oE "[0-9a-f]{64}" index.html | head -1)
          test -n "$PH" || { echo "::error::no auth digest found in index.html"; exit 1; }
          FOUND=0
          for f in $(git ls-files '*.html' '*.yml' '*.yaml' '*.json' '*.md' '*.txt'); do
            for w in $(grep -ohE "[A-Za-z0-9!@#$%^&*_-]{4,64}" "$f" | sort -u); do
              if [ "$(printf '%s' "$w" | sha256sum | awk '{print $1}')" = "$PH" ]; then
                echo "::error file=$f::the access code appears here in plaintext"
                FOUND=1
              fi
            done
          done
          test "$FOUND" -eq 0
          echo "Access code not present in plaintext ✓"
      - name: Check CNAME
        run: |
          test -f CNAME
          grep -q "dori.joelycannoli.com" CNAME
          echo "CNAME OK ✓"
      - name: Check security headers in vercel.json
        run: |
          grep -q "X-Frame-Options" vercel.json
          grep -q "X-Content-Type-Options" vercel.json
          echo "Security headers present ✓"
